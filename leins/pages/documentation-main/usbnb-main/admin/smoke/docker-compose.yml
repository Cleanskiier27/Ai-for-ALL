version: '3.9'

services:
  # NetworkBuster M2M Middleware - Luna.eu Backend
  nb-middleware:
    build: .
    container_name: networkbuster-m2m
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # NetworkBuster Vite UI — served from built dist
  nb-ui:
    image: nginx:alpine
    container_name: networkbuster-ui
    restart: always
    ports:
      - "5173:80"
    volumes:
      - ./networkbuster-os-ui/dist:/usr/share/nginx/html:ro
    depends_on:
      nb-middleware:
        condition: service_healthy
