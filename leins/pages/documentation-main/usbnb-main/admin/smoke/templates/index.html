<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetworkBuster OS - Access Terminal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        :root {
            --primary: #0ff;
            --bg: #050510;
            --glass: rgba(0, 255, 255, 0.03);
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .terminal {
            background: var(--glass);
            border: 1px solid rgba(0, 255, 255, 0.15);
            padding: 50px;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.05), inset 0 0 20px rgba(0, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            text-align: center;
            max-width: 450px;
            width: 100%;
            z-index: 10;
        }
        h1 {
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 5px;
            font-size: 28px;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
        }
        p {
            color: #66b3b3;
            font-size: 14px;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }
        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }
        label {
            display: block;
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 13px;
            letter-spacing: 2px;
        }
        input[type="password"] {
            width: 100%;
            padding: 15px;
            background: rgba(0, 20, 20, 0.6);
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: var(--primary);
            border-radius: 4px;
            outline: none;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 18px;
            letter-spacing: 10px;
            text-align: center;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        input[type="password"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }
        button {
            width: 100%;
            padding: 16px;
            background: rgba(0, 255, 255, 0.05);
            color: var(--primary);
            border: 1px solid var(--primary);
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            border-radius: 4px;
        }
        button:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 25px var(--primary);
        }
        .grid-bg {
            position: absolute;
            top: -50%; left: -50%; right: -50%; bottom: -50%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: moveGrid 20s linear infinite;
        }
        @keyframes moveGrid {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px) translateZ(-200px); }
        }
        .scanline {
            width: 100%;
            height: 100px;
            z-index: 20;
            position: absolute;
            pointer-events: none;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(0,255,255,0.1) 50%, rgba(0,0,0,0) 100%);
            opacity: 0.1;
            animation: scanline 6s linear infinite;
        }
        @keyframes scanline {
            0% { top: -100px; }
            100% { top: 100%; }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="scanline"></div>
    <div class="terminal">
        <h1>NetworkBuster</h1>
        <p>SECURE OS TERMINAL /// AWAITING AUTHORIZATION</p>
        <div class="input-group">
            <label>ACCESS_CODE</label>
            <input type="password" id="passcode" placeholder="****" autocomplete="off" />
        </div>
        <button onclick="window.location.href='/dashboard'">Initialize Sequence</button>
    </div>
</body>
</html>
